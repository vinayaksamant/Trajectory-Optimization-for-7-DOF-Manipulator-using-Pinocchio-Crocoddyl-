[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "panda-trajopt"
version = "0.1.0"
description = "Learning project for trajectory optimization and MPC on a Franka Panda"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
robotics = [
  "pin>=3.0",
  "crocoddyl>=3.0",
  "example-robot-data>=4.0",
]
simulation = [
  "mujoco>=3.3",
  "mujoco-menagerie>=2026.9.0",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

