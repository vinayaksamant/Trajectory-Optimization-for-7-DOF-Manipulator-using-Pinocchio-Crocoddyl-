robot:
  name: panda
  arm_joint_names:
    - panda_joint1
    - panda_joint2
    - panda_joint3
    - panda_joint4
    - panda_joint5
    - panda_joint6
    - panda_joint7
  locked_joint_names:
    - panda_finger_joint1
    - panda_finger_joint2
  locked_joint_positions: [0.04, 0.04]
  end_effector_frame: panda_hand_tcp
  torque_limits:
    - 87.0
    - 87.0
    - 87.0
    - 87.0
    - 12.0
    - 12.0
    - 12.0

trajectory:
  time_step: 0.02
  horizon_steps: 100

costs:
  end_effector_position: 20.0
  terminal_end_effector_position: 3000.0
  end_effector_orientation: 5.0
  terminal_end_effector_orientation: 1000.0
  state_regularization: 0.05
  terminal_state_regularization: 10.0
  control_regularization: 0.0001
  joint_limits: 10000.0
  obstacle_avoidance: 10000.0

reaching:
  target_position: [0.2745, 0.08, 0.6011]
  target_orientation_rpy: [0.0, 0.0, 0.0]
  max_iterations: 100
  stopping_threshold: 1.0e-3
  playback_settle_time: 0.5
  playback_position_gain: 60.0
  playback_velocity_gain: 12.0

obstacle:
  center_position: [0.5325, 0.052, 0.2731]
  radius: 0.02
  safety_margin: 0.005
  soft_constraint_buffer: 0.006
